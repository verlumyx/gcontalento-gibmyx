name: gcontalento

services:
  # Laravel Application (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        UID: 1000
        GID: 1000
    container_name: gcontalento_app
    restart: unless-stopped
    ports:
      # Vite dev server (HMR)
      - "5174:5174"
    volumes:
      # Live source code (development): changes are reflected without rebuild
      - .:/var/www/html
      # Keep the image-provided dependencies (WITH dev) over the bind mount
      - /var/www/html/vendor
      - /var/www/html/node_modules
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      # Disable OPcache in development so PHP changes are picked up immediately
      - ./docker/php/opcache.dev.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
    networks:
      - gcontalento

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: gcontalento_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - gcontalento

networks:
  gcontalento:
    driver: bridge
